# VPetLLM Remote Chat —— nginx / OpenResty 反向代理
# 单个二进制在 127.0.0.1:8787 同时提供网页 + WebSocket 中继，这里统一反代。
# 把 chat.ycxom.com 换成你的域名；证书路径按实际修改。

# WebSocket 升级映射（放在 http{} 段，只需一次）
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# HTTP -> HTTPS 跳转
server {
    listen 80;
    listen [::]:80;
    server_name chat.ycxom.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    http2 on;
    server_name chat.ycxom.com;

    ssl_certificate     /etc/letsencrypt/live/chat.ycxom.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/chat.ycxom.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # 网页与 WebSocket 同源同端口，一个 location 全覆盖
    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;

        # WebSocket 升级（缺这两行 → 握手失败 / WebSocketException）
        proxy_set_header Upgrade    $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        # REQUIRE_TLS=true 依赖这个头，缺了 relay 会 426 拒绝
        proxy_set_header X-Forwarded-Proto $scheme;

        # 长连接别被过早掐断
        proxy_read_timeout  3600s;
        proxy_send_timeout  3600s;
    }
}
